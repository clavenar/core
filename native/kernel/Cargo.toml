[package]
name = "clavenar-kernel"
version = "0.0.91"
edition = "2024"

[features]
http-probe = []

[dependencies]
clv-abi = { path = "../../crates/clv-abi" }

[build-dependencies]
clv-abi = { path = "../../crates/clv-abi" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }

[[bin]]
name = "clavenar-kernel"
path = "src/main.rs"
test = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
